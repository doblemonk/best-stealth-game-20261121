<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Vault</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #0b0e14;
}
#game {
  display: block;
  width: 1280px;
  height: 720px;
  position: fixed;
  left: 0;
  top: 0;
}
#status {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
</style>
</head>
<body>
<canvas id="game" aria-label="Shadow Vault: steal the golden idol and reach the exit unseen, past the guards and their vision cones"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
